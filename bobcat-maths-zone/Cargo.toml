[package]
name = "bobcat-maths-zone"
version = "0.7.2"
edition = "2024"
license = "MIT"
description = "bobcat-sdk DSL for math that makes checked math with drop-in Python code easy."
homepage = "https://bobcat.so"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
proc-macro = true

[dependencies]
bobcat-maths = { version = "0.7.2", path = "../bobcat-maths" }
num-bigint = { version = "0.4.6", default-features = false, features = ["std"] }
num-integer = { version = "0.1.46", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
proc-macro2 = "1.0.86"
quote = "1.0.37"
syn = { version = "2.0.75", features = ["full"] }
