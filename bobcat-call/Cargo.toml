[package]
name = "bobcat-call"
version = "0.6.3"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for calling contracts on Arbitrum Stylus."
homepage = "https://bobcat.so"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_call"

[features]
alloc = []
dont-define-symbols = ["bobcat-entry/dont-define-symbols"]

[dependencies]
bobcat-entry = { version = "0.6.3", path = "../bobcat-entry" }
bobcat-maths = { version = "0.6.3", path = "../bobcat-maths" }
paste.workspace = true
