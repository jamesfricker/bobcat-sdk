[workspace]

[package]
name = "reference"
version = "0.1.11"
edition = "2024"

[dependencies]
alloy-primitives = { version = "=0.8.20", default-features = false, features = ["sha3-keccak"] }
ruint = { version = "=1.12.3", default-features = false }
stylus-sdk = { version = "0.9.2" }

[lib]
name = "libreference"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "reference"
path = "src/main.rs"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
