[package]
name = "bobcat-sdk-examples-001"
version = "0.1.11"
edition = "2024"

[dependencies]
bobcat-sdk = { version = "0.4.1", workspace = true, features = ["panic"] }

[[bin]]
name = "bobcat-sdk-examples-001"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
