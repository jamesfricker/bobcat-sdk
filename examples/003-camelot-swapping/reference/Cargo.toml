[workspace]

[package]
name = "reference"
version = "0.1.11"
edition = "2024"

[dependencies]
alloy-primitives = { version = "=0.8.20", default-features = false }
alloy-sol-types = { version = "=0.8.20", default-features = false }
stylus-sdk = "0.9.2"

[[bin]]
name = "reference"
path = "src/main.rs"

[lib]
name = "libreference"
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
